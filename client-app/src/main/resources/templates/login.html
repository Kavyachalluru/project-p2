
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <title>REVSHOP | Login </title>
   <style>
        /* POPPINS FONT */
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap');
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }
        body, html {
            height: 100%;
            margin: 0;
            display: flex;
            justify-content: flex-end;
            margin-right: 60px;
            align-items: center;
            overflow: hidden;
        }
        /* Background Image Fullscreen */
        .background-iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            border: none;
           background: url('https://t3.ftcdn.net/jpg/02/92/90/56/360_F_292905667_yFUJNJPngYeRNlrRL4hApHWxuYyRY4kN.jpg') no-repeat center center;
            background-size: cover;
        }
        .wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            background: rgba(39, 39, 39, 0);
            width: 600px;
            padding: 100px;
            border-radius: 10px;
            z-index: 1;
        }
        .form-box {
            width: 100%;
        }
        header {
            color: #3146b0b6;
            font-weight: bold;
            font-size: 40px;
            text-align: center;
            padding-bottom: 40px;
        }
        .input-box {
            position: relative;
            margin-bottom: 20px;
        }
        .input-field {
            font-size: 16px;
            background: rgba(206, 181, 181, 0.212);
            color: #000000;
            height: 50px;
            width: 100%;
            padding-left: 45px;
            border: none;
            border-radius: 30px;
            outline: none;
            transition: .2s ease;
        }
        .input-field:hover, .input-field:focus {
            background: rgba(125, 103, 103, 0.325);
        }
        ::-webkit-input-placeholder {
            color: #000000;
        }
        .input-box i {
            position: absolute;
            top: 12px;
            left: 17px;
            color: #000000;
        }
        .submit {
            font-size: 17px;
            font-weight: 500;
            color: black;
            height: 45px;
            width: 100%;
            border: none;
            border-radius: 30px;
            background: rgba(13, 57, 234, 0.422);
            cursor: pointer;
            transition: .3s ease-in-out;
        }
        .submit:hover {
            background: rgba(13, 57, 234, 0.67);
            box-shadow: 1px 5px 7px 1px rgba(0, 0, 0, 0.2);
        }
        .top span {
            color: #000000;
            font-size: 15px;
            display: block;
            text-align: center;
        }
        .top span a {
            font-size: 17px;
            font-weight: 500;
            color: #311ccf;
            margin-left: 10px;
            text-decoration: underline;
        }
        .two-col {
            display: flex;
            justify-content: space-between;
            color: #060606;
            font-size: 16px;
            padding-bottom: 15px;
            padding-left: 15px;
        }
        .two label a {
            text-decoration: none;
            padding-right: 20px;
            color: #ff0000;
        }
        .two label a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <!-- Background Image Fills Entire Page -->
    <div class="background-iframe"></div>

    <!-- Form Content Overlay -->
    <div class="wrapper">
        <div class="form-box">
            <header>Login</header>
            <form th:action="@{/revshop/login}" method="post">
                <div class="input-box">
                    <input type="email" name="email" class="input-field" placeholder="Username or Email" required>
                    <i class="bx bx-user"></i>
                </div>
                <div class="input-box">
                    <input type="password" name="password" class="input-field" placeholder="Password" required>
                    <i class="bx bx-lock-alt"></i>
                </div>
                <div class="two-col">
                    <div class="one">
                        <input type="checkbox" id="login-check" name="rememberMe">
                        <label for="login-check">Remember Me</label>
                    </div>
                    <div class="two">
                        <label><a th:href="@{/revshop/forgotpassword}">Forgot password?</a></label>
                    </div>
                </div>
                <div class="input-box">
                    <input type="submit" class="submit" value="Sign In">
                </div>
                <div class="top">
                <span>Don't have an account? <a th:href="@{/revshop/register}">Seller</a> <a th:href="@{/revshop/buyerRegister}">Buyer</a>
                </span>
            </div>
            </form>
        </div>
    </div>

</body>
</html>
